[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "figcraft-mcp"
version = "0.2.0"
description = "Universal Model Context Protocol (MCP) bridge and automation toolkit for FigCraft"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "FigCraft Community" }
]
keywords = ["mcp", "figcraft", "design", "ai", "automation", "vector-graphics", "claude", "cursor", "antigravity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.scripts]
figcraft-mcp = "figcraft_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["figcraft_mcp*"]
