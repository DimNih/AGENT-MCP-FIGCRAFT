<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <!-- Flat Solid Foundation (Graphite & Slate, Zero Gradients) -->
  <rect width="1200" height="400" fill="#0E1116"/>
  <rect width="1198" height="398" x="1" y="1" fill="none" stroke="#212631" stroke-width="2"/>

  <!-- Left Side: Editorial Typography & Product Architecture -->
  <g transform="translate(64, 56)">
    <!-- Metadata Label -->
    <text x="0" y="24" fill="#6E7686" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5">FIGCRAFT / MODEL CONTEXT PROTOCOL</text>
    
    <!-- Title -->
    <text x="0" y="80" fill="#F0F3F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1">
      Bridge AI agents to<cr/>
      <tspan x="0" dy="50">native vector canvas.</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="184" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="-0.2">
      Bi-directional IPC server for FigCraft. Drive live visual manipulation<tspan x="0" dy="24">on port 9001, or execute headless pipeline builds.</tspan>
    </text>

    <!-- Technical Specification Table (Quiet, Monospace, Solid) -->
    <g transform="translate(0, 246)" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12">
      <rect width="460" height="64" fill="#141820" stroke="#242A36" stroke-width="1"/>
      
      <text x="18" y="26" fill="#6E7686">protocol</text>
      <text x="96" y="26" fill="#C9D1D9">MCP 2024-11-05 (JSON-RPC 2.0)</text>

      <text x="18" y="48" fill="#6E7686">runtime</text>
      <text x="96" y="48" fill="#C9D1D9">Python 3.8+ (Zero dependencies)</text>

      <line x1="330" y1="0" x2="330" y2="64" stroke="#242A36" stroke-width="1"/>
      
      <text x="346" y="26" fill="#6E7686">port</text>
      <text x="388" y="26" fill="#E25624" font-weight="700">9001</text>
      
      <text x="346" y="48" fill="#6E7686">mode</text>
      <text x="388" y="48" fill="#C9D1D9">Live &amp; Headless</text>
    </g>
  </g>

  <!-- Right Side: The Actual Product (Precision Drafting Canvas Inspector) -->
  <g transform="translate(620, 40)">
    <!-- Canvas Frame Container -->
    <rect width="520" height="320" fill="#13171F" stroke="#242A36" stroke-width="1"/>
    
    <!-- Top Canvas Status Header -->
    <rect width="520" height="32" fill="#181D26" stroke="#242A36" stroke-width="1"/>
    <text x="16" y="21" fill="#6E7686" font-family="'JetBrains Mono', monospace" font-size="11">CANVAS 100%  •  ROOT / PAGE_01</text>
    <rect x="420" y="8" width="84" height="16" fill="#1E2430" stroke="#2D3444" stroke-width="1"/>
    <text x="430" y="20" fill="#7EE787" font-family="'JetBrains Mono', monospace" font-size="10">ATTACHED:OK</text>

    <!-- Hairline Coordinate Grid -->
    <g stroke="#1A1F2A" stroke-width="1">
      <line x1="40" y1="32" x2="40" y2="320"/>
      <line x1="140" y1="32" x2="140" y2="320"/>
      <line x1="240" y1="32" x2="240" y2="320"/>
      <line x1="340" y1="32" x2="340" y2="320"/>
      <line x1="440" y1="32" x2="440" y2="320"/>
      <line x1="0" y1="90" x2="520" y2="90"/>
      <line x1="0" y1="160" x2="520" y2="160"/>
      <line x1="0" y1="230" x2="520" y2="230"/>
    </g>

    <!-- Vector Elements Assembled on Screen (Real Solid Components) -->
    <!-- Frame Container 1 -->
    <rect x="50" y="60" width="410" height="190" fill="#171C25" stroke="#313847" stroke-width="1"/>
    
    <!-- Frame Label Badge -->
    <rect x="50" y="44" width="138" height="16" fill="#242A36"/>
    <text x="56" y="56" fill="#C9D1D9" font-family="'JetBrains Mono', monospace" font-size="10">Frame: Dialog_Auth</text>

    <!-- Frame Components -->
    <rect x="74" y="84" width="40" height="40" fill="#242A36"/>
    <polygon points="94,92 104,108 84,108" fill="#E25624"/>

    <!-- Text Layer Preview -->
    <text x="126" y="98" fill="#F0F3F6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Secure Access Gateway</text>
    <text x="126" y="116" fill="#6E7686" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">node_id: text_9401 • fill: #F0F3F6</text>

    <!-- Real-time Anchor Point Crosshair & Precision Handles -->
    <g stroke="#E25624" stroke-width="1">
      <!-- Horizontal Coordinate Guide -->
      <line x1="20" y1="150" x2="490" y2="150" stroke-dasharray="3 3"/>
      <!-- Vertical Coordinate Guide -->
      <line x1="280" y1="50" x2="280" y2="270" stroke-dasharray="3 3"/>
    </g>

    <!-- Node Dimension Annotation -->
    <rect x="74" y="140" width="360" height="34" fill="#1C212C" stroke="#2D3444" stroke-width="1"/>
    <text x="88" y="161" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11">input_field [w:360, h:34, r:4] → <tspan fill="#C9D1D9">#1C212C</tspan></text>

    <!-- Primary Action Button with Single Accent -->
    <rect x="74" y="190" width="120" height="32" fill="#E25624"/>
    <text x="110" y="210" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">CONFIRM</text>

    <!-- Vector Anchor Square Node at Cursor -->
    <g transform="translate(280, 150)">
      <rect x="-4" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#E25624" stroke-width="2"/>
      
      <!-- Coordinate Callout -->
      <rect x="12" y="-18" width="110" height="20" fill="#0E1116" stroke="#2D3444" stroke-width="1"/>
      <text x="18" y="-4" fill="#C9D1D9" font-family="'JetBrains Mono', monospace" font-size="10">x:280.0  y:150.0</text>
    </g>

    <!-- Live Execution Status Bar -->
    <g transform="translate(0, 280)">
      <rect width="520" height="40" fill="#161A22" stroke="#242A36" stroke-width="1"/>
      <text x="16" y="24" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11">MCP_CMD: <tspan fill="#F0F3F6">create_node(type="rectangle", w=360, h=34)</tspan></text>
      <text x="460" y="24" fill="#6E7686" font-family="'JetBrains Mono', monospace" font-size="11">0.05s</text>
    </g>
  </g>
</svg>
