<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="40%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="radial-spot" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#radial-spot)"/>
  <rect width="1198" height="418" x="1" y="1" rx="23" fill="none" stroke="#1F2937" stroke-width="2"/>

  <!-- Background Abstract Technical Lines -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="680" y1="0" x2="680" y2="420"/>
    <line x1="840" y1="0" x2="840" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
  </g>

  <!-- LEFT BRANDING / TYPOGRAPHY -->
  <g transform="translate(80, 75)">
    <!-- Protocol Badge -->
    <rect width="210" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#10B981"/>
    <text x="32" y="21" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">MCP PROTOCOL 2024</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      FIGCRAFT <tspan fill="url(#brand)">MCP</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="145" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400">
      Universal AI Design Bridge &amp; Real-time Desktop Co-Designing
    </text>

    <!-- Secondary descriptive line -->
    <text x="0" y="178" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15">
      Claude Desktop  •  Antigravity  •  Cursor  •  Gemini CLI  •  Python SDK
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <rect width="150" height="34" rx="8" fill="#1E1B4B" stroke="#4338CA" stroke-width="1"/>
      <text x="14" y="22" fill="#A5B4FC" font-family="sans-serif" font-size="13" font-weight="600">⚡ Live Co-Design</text>

      <!-- Pill 2 -->
      <rect x="162" width="160" height="34" rx="8" fill="#064E3B" stroke="#059669" stroke-width="1"/>
      <text x="176" y="22" fill="#6EE7B7" font-family="sans-serif" font-size="13" font-weight="600">🛠 Headless Builds</text>

      <!-- Pill 3 -->
      <rect x="334" width="155" height="34" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="348" y="22" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="600">🌍 Cross-Platform</text>
    </g>
  </g>

  <!-- RIGHT VISUAL / INTERACTIVE DIAGRAM -->
  <g transform="translate(740, 60)">
    <!-- Mock UI Canvas Window -->
    <rect width="380" height="290" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Window Bar -->
    <rect width="380" height="38" rx="16" fill="#1E293B"/>
    <circle cx="22" cy="19" r="5" fill="#EF4444"/>
    <circle cx="38" cy="19" r="5" fill="#F59E0B"/>
    <circle cx="54" cy="19" r="5" fill="#10B981"/>
    <text x="75" y="24" fill="#64748B" font-family="sans-serif" font-size="12" font-weight="500">FigCraft - Live Canvas (Port 9001)</text>

    <!-- Canvas Inner Elements Being Generated Live -->
    <g transform="translate(24, 60)">
      <!-- Card Frame -->
      <rect width="332" height="190" rx="12" fill="#182234" stroke="#334155" stroke-dasharray="4 4"/>
      
      <!-- Generated Card Inside -->
      <rect x="20" y="20" width="292" height="150" rx="10" fill="#1E293B" stroke="url(#brand)" stroke-width="1.5" filter="url(#glow)"/>
      
      <!-- Avatar / Pill -->
      <rect x="36" y="36" width="70" height="24" rx="12" fill="#10B981" opacity="0.2"/>
      <text x="48" y="52" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="700">● AI ACTIVE</text>

      <!-- Metric -->
      <text x="36" y="90" fill="#94A3B8" font-family="sans-serif" font-size="11">Automated Node Assembly</text>
      <text x="36" y="118" fill="#F8FAFC" font-family="sans-serif" font-size="22" font-weight="800">100% Native Vector</text>

      <!-- Progress bar -->
      <rect x="36" y="136" width="260" height="6" rx="3" fill="#334155"/>
      <rect x="36" y="136" width="200" height="6" rx="3" fill="url(#brand)"/>

      <!-- Floating Pointer Tool -->
      <g transform="translate(245, 95)" filter="url(#glow)">
        <polygon points="0,0 20,6 12,12 18,22 14,24 8,14 2,18" fill="#38BDF8"/>
        <text x="24" y="26" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="700">Agent Co-Designing</text>
      </g>
    </g>
  </g>
</svg>
