<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- Solid Dark Graphite Base -->
  <rect width="256" height="256" rx="48" fill="#111317"/>
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#222733" stroke-width="2"/>

  <!-- Technical Canvas Grid Reference (Hairline 1px) -->
  <g stroke="#1D222C" stroke-width="1">
    <line x1="32" y1="0" x2="32" y2="256"/>
    <line x1="128" y1="0" x2="128" y2="256"/>
    <line x1="224" y1="0" x2="224" y2="256"/>
    <line x1="0" y1="32" x2="256" y2="32"/>
    <line x1="0" y1="128" x2="256" y2="128"/>
    <line x1="0" y1="224" x2="256" y2="224"/>
  </g>

  <!-- Vector Construction Guides (Blueprints) -->
  <g stroke="#2C3342" stroke-width="1.5">
    <!-- Tangent Guideline -->
    <line x1="48" y1="176" x2="208" y2="80"/>
    <circle cx="48" cy="176" r="3" fill="#2C3342"/>
    <circle cx="208" cy="80" r="3" fill="#2C3342"/>
  </g>

  <!-- Flat Vector Pen & Craft Node Geometry -->
  <g fill="none" stroke-linejoin="round">
    <!-- Pen Tool Barrel (Solid Neutral White & Off-White) -->
    <path d="M128 44 L180 96 L154 122 L102 70 Z" fill="#E5E7EB"/>
    <path d="M102 70 L154 122 L138 138 L86 86 Z" fill="#D1D5DB"/>
    
    <!-- Pen Nib Metal -->
    <path d="M128 148 L170 106 L154 90 L112 132 Z" fill="#9CA3AF"/>
    <path d="M128 148 L112 132 L78 166 L86 186 L106 194 Z" fill="#4B5563"/>
    
    <!-- Nib Tip Needle -->
    <polygon points="78,166 62,206 102,190 86,186" fill="#F3F4F6"/>
    
    <!-- Ink Channel / Slit (Solid Dark Hairline) -->
    <line x1="62" y1="206" x2="98" y2="170" stroke="#111317" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="102" cy="166" r="3.5" fill="#111317"/>
  </g>

  <!-- Precision Anchor Point (Solid Rust / International Orange Accent) -->
  <g>
    <!-- Handle Bar Lines -->
    <line x1="128" y1="128" x2="188" y2="128" stroke="#E25624" stroke-width="1.5"/>
    <line x1="128" y1="128" x2="68" y2="128" stroke="#E25624" stroke-width="1.5"/>
    
    <!-- Handle Endpoint Dots -->
    <circle cx="68" cy="128" r="3" fill="#E25624"/>
    <circle cx="188" cy="128" r="3" fill="#E25624"/>
    
    <!-- Active Center Anchor Point (Solid Square Node) -->
    <rect x="122" y="122" width="12" height="12" fill="#E25624"/>
    <rect x="124" y="124" width="8" height="8" fill="#FFFFFF"/>
  </g>
</svg>
